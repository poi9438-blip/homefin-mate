# CI: 백엔드, Python, 프론트 테스트 + 테스트 명세 대조 (배포 없음)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # 테스트 + JaCoCo 리포트 (test 단계에서 생성)
      # Maven Wrapper로 정해진 Maven 버전(3.9.9) 사용 (#16)
      - run: ./mvnw -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: python-service/test-results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8·Vitest 5는 Node 22.12 이상 필요 (#86)
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results/

  # 세 모듈이 끝난 뒤(실패해도) 결과를 명세와 대조. 명세·코드 불일치, 실패, 미실행이 있으면 실패
  test-case-status:
    needs: [backend, python, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: backend/target
      - uses: actions/download-artifact@v4
        with:
          name: python-test-results
          path: python-service/test-results
      - uses: actions/download-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
      # 명세 대조 (로그 + Summary, 불일치·실패·미실행이면 실패)
      - name: Compare test cases with results
        shell: bash
        run: python3 scripts/tc_status.py --markdown --strict | tee -a "$GITHUB_STEP_SUMMARY"
