# 프론트 nginx 설정 (정적 파일 + /api 프록시)
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더: MIME 추측 금지, 다른 사이트의 iframe 안에 넣기 금지, 다른 사이트로는 출처 주소만 전달
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 없는 경로는 index.html로 (React Router가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 요청은 백엔드(8100)로 전달
    location /api/ {
        proxy_pass http://backend:8100/api/;
        proxy_set_header Host $host;
        # 실제 접속 IP, 거쳐 온 IP 목록, 접속 방식(http/https)을 백엔드로 전달
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
