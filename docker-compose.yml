services:
  mysql:
    image: mysql:8.0

    # 컨테이너 이름 고정 (같은 이름 있으면 충돌)
    container_name: homefinmate-mysql

    environment:
      # 비밀번호는 .env에서만 가져올 수 있도록 처리 (기본값 없음)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정하세요}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homefinmate}
      MYSQL_USER: ${MYSQL_USER:-hfmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD를 .env에 설정하세요}

    # 호스트 127.0.0.1:3310 => 컨테이너 3306 (이 PC에서만 접속)
    ports:
      - "127.0.0.1:3310:3306"

    # DB 데이터 영구 저장
    volumes:
      - mysql_data:/var/lib/mysql

    # MySQL 준비 상태 확인 (10초마다 확인, 5번 실패하면 unhealthy)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
       
  # Spring Boot 백엔드 (8100)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 기본 이미지 (OTel 에이전트 없음, 관측 compose는 target: otel)
      target: runtime
    container_name: homefinmate-backend
    # 화면(nginx)을 거치지 않는 직접 호출은 이 PC에서만 (개발용 Vite 프록시·curl)
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      SERVER_PORT: 8100
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-homefinmate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-hfmuser}
      # 비밀값 (.env 필수, 기본값 없음)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY를 .env에 설정하세요}
      RISKWATCH_BASE_URL: ${RISKWATCH_BASE_URL:-http://host.docker.internal:8120}
      RISKWATCH_TOKEN_SECRET: ${RISKWATCH_TOKEN_SECRET:?RISKWATCH_TOKEN_SECRET을 .env에 설정하세요}
      PYTHON_SERVICE_URL: http://homefinmate-python:8200
      # 화면 주소 (CORS 허용 출처), API 문서 공개 여부 (기본 꺼짐)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3100}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 관리자로 지정할 이메일 (쉼표로 여러 개, 기본은 관리자 없음)
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # 로그인 쿠키 Secure 속성 (로컬 http라 기본 false, HTTPS 운영은 true)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 기록 보관 기간 (일)
      RETENTION_LOGIN_FAILURE_DAYS: ${RETENTION_LOGIN_FAILURE_DAYS:-90}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
    depends_on:
      mysql:
        condition: service_healthy
    # 백엔드 준비 상태 확인 (/actuator/health가 UP이면 healthy)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Python 지역 분석 서비스 (8200)
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
      # 기본 이미지 (OTel 패키지 없음)
      target: runtime
    container_name: homefinmate-python
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      ENV: ${ENV:-development}
    # Python 서비스 준비 상태 확인
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 프론트 nginx (호스트 3100 => 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homefinmate-frontend
    # 화면 주소 3100 => nginx 8080 (root 없이 실행하는 nginx)
    ports:
      - "3100:8080"
    # 백엔드·Python 서비스가 준비된 뒤 시작
    depends_on:
      backend:
        condition: service_healthy
      python-service:
        condition: service_healthy

volumes:
  mysql_data:
