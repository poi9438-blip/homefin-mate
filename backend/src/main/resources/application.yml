# 백엔드 설정 (비밀값은 환경변수/.env에서 주입)

spring:
  application:
    name: homefinmate-backend

  # 로컬 실행 시 저장소 루트의 .env를 설정으로 불러옴 (없으면 무시)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # TODO: alpha / production으로 환경 분리할 것
    # Docker 안에서는 DB_URL로 덮어씀, DB 시간 기준을 UTC로
    url: ${DB_URL:jdbc:mysql://localhost:3310/homefinmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

    # DB 사용자 (기본값을 docker-compose의 MYSQL_USER와 동일하게)
    username: ${DB_USERNAME:hfmuser}

    # TODO: DB_PASSWORD, MYSQL_PASSWORD 환경변수명을 하나로 통일할 것
    # 현재는 기존 Docker Compose 설정과의 호환을 위해 둘 다 지원
    password: ${DB_PASSWORD:${MYSQL_PASSWORD}}

    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 10000
      socket-timeout: 10000

  # Flyway: 이미 테이블이 있는 DB(ddl-auto: update로 만든 DB)는 V1을 건너뛰고 V2부터 실행
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    # 요청 끝까지 DB 커넥션을 잡지 않도록 OSIV 끔
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)가 만들고 바꿈, Hibernate는 엔티티와 테이블이 맞는지 확인만
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # TODO: 최신 Hibernate에서는 자동 감지 가능하다고 함 - 이후 삭제 예정
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  # 기본 서버 포트 8100
  port: ${SERVER_PORT:8100}

app:
  # CORS 허용 출처 (쉼표로 여러 개, 기본은 화면 주소)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  jwt:
    # 토큰 서명 비밀키
    secret: ${JWT_SECRET}
    # 토큰 유효 기간
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  encryption:
    # 소득 암호화 키 (.env의 ENCRYPTION_KEY)
    key: ${ENCRYPTION_KEY}
  riskwatch:
    # RiskWatch 서버 주소 (없으면 fallback)
    base-url: ${RISKWATCH_BASE_URL:http://localhost:8120}
    # 연결 타임아웃, 응답 타임아웃 (밀리초). RiskWatchClient 전용 RestTemplate이 실제로 읽음
    connect-timeout-ms: ${RISKWATCH_CONNECT_TIMEOUT_MS:1000}
    timeout-ms: ${RISKWATCH_TIMEOUT_MS:2000}
    # 재시도 횟수 (총 시도 = 값 + 1). 5xx·연결 실패만 재시도
    retry-count: ${RISKWATCH_RETRY_COUNT:2}
    # 재시도 대기 시작값 (밀리초, 시도마다 2배)
    backoff-ms: ${RISKWATCH_BACKOFF_MS:200}
    # 서킷 브레이커 (실패율 기준, 집계 시도 수, 최소 시도 수, 차단 시간, 시험 호출 수)
    circuit-breaker:
      failure-rate-threshold: ${RISKWATCH_CB_FAILURE_RATE:50}
      sliding-window-size: ${RISKWATCH_CB_WINDOW:10}
      minimum-calls: ${RISKWATCH_CB_MIN_CALLS:5}
      open-wait-ms: ${RISKWATCH_CB_OPEN_WAIT_MS:10000}
      half-open-calls: ${RISKWATCH_CB_HALF_OPEN_CALLS:2}
  python-service:
    # Python 지역 분석 서비스 주소
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8200}

management:
  endpoints:
    web:
      exposure:
        # 웹으로는 health만 공개 (env, beans 등 내부 정보 노출 방지)
        include: health
  endpoint:
    health:
      # 상태 세부 정보 숨김
      show-details: never

springdoc:
  # Swagger UI, API 문서 (보안상 기본 꺼짐)
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    # API 명세 JSON 주소
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    # Swagger UI 주소
    path: /swagger-ui.html
    # HTTP 메서드 순으로 정렬
    operationsSorter: method

logging:
  level:
    # com.homefinmate만 DEBUG, 나머지는 INFO(기본)
    com.homefinmate: DEBUG
    # 이후 사용 예정 (Spring Security 로그 레벨)
    org.springframework.security: INFO
  pattern:
    # 로그 형식: 시간 [스레드] [traceId] 레벨 클래스 - 메시지
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"
